[project]
name = "baywheels-ai-agent"
version = "0.1.0"
description = "BayWheels AI agent using MCP + Pydantic-AI"
readme = "README.md"
requires-python = ">=3.10"  # MCP support requires Python 3.10+
dependencies = [
    "asyncpg>=0.30.0",
    "faker>=37.4.0",
    "fastmcp>=2.9.2",
    "logfire>=3.21.1",
    "psycopg2-binary>=2.9.10",
    "pydantic-ai[logfire]>=0.2.23",
    "python-dotenv>=1.1.0",
    "redis>=6.2.0",
    "sqlparse>=0.4.4",
]
